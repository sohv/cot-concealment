[project]
name = "cue-swap"
version = "0.1.0"
description = "Cue swap validation experiment: separating hint mention from hint influence"
requires-python = ">=3.10"
# generation is the only stage that needs a gpu. the judge, the placement analysis and the cell
# analysis all read rows off disk, so the base install stays importable on a laptop.
dependencies = [
    "datasets<4",
    "huggingface-hub>=0.30,<1.0",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "pydantic>=2.7",
    "python-dotenv>=1.2.2",
    "scipy",
    "setuptools>=83.0.0",
    "simple-parsing",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pre-commit",
    "ruff",
]
# openrouter speaks the openai protocol, so the openai sdk points at its base url unchanged.
judge = ["openai>=1.40"]
# the inference stack is pinned to the gpu box's cuda build and does not resolve on macos, so it is an
# extra rather than a base dependency: uv sync --extra gpu
gpu = [
    "transformers==4.51.3",
    "vllm==0.8.5.post1",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = ["E501", "E402", "E741", "F841", "F403", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]
